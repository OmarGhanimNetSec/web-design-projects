<!DOCTYPE html>
<html>

<head>
    <title>Fruit Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="text-center">

            <div class="row justify-content-center mb-4">
                <div class="col-auto">
                    <img src="images/Apple.png" id="img1" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/banana.png" id="img2" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/orange.jpg" id="img3" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/strawberry.png" id="img4" width="120">
                </div>
                <div class="col-auto">
                    <img src="images/carrots.png" id="img5" width="120">
                </div>
            </div>

            <form>
                <div class="mb-3">
                    <label>Speed Level:</label><br>

                    <input name="speed" type="radio" id="easy" value="1000" checked> Easy
                    <input name="speed" type="radio" id="medium" value="500"> Medium
                    <input name="speed" type="radio" id="hard" value="250"> Hard
                </div>

                <div class="mb-4">
                    <input type="button" onclick="startGame()" id="START" value="Start Game" class="btn btn-success">
                    <input type="button" onclick="stopSpinning()" id="Stop" value="Stop Spinning" class="btn btn-danger" disabled>
                </div>

                <div class="row justify-content-center">
                    <div class="col-4">
                        <h3>Wins</h3>
                        <h1 id="wins">0</h1>
                    </div>
                    <div class="col-4">
                        <h3>Losts</h3>
                        <h1 id="losts">0</h1>
                    </div>
                </div>
            </form>

        </div>
    </div>

<script>

var images = ["images/Apple.png","images/banana.png","images/orange.jpg","images/strawberry.png","images/carrots.png"];

var gameInterval;
var wins = 0;
var losts = 0;


function startGame() {

    document.getElementById("START").disabled = true;
    document.getElementById("Stop").disabled = false;

    var easy_level = document.getElementById("easy");
    var mid_level = document.getElementById("medium");
    var hard_level = document.getElementById("hard");

    var game_speed = 0;

    if (easy_level.checked == true)
        game_speed = 1000;
    else if (mid_level.checked == true)
        game_speed = 500;
    else
        game_speed = 250;

    gameInterval = setInterval(changePictures, game_speed);
}

function changePictures() {

    var random_number;

    random_number = Math.floor(Math.random() * 5);
    document.getElementById("img1").src = images[random_number];

    random_number = Math.floor(Math.random() * 5);
    document.getElementById("img2").src = images[random_number];

    random_number = Math.floor(Math.random() * 5);
    document.getElementById("img3").src = images[random_number];

    random_number = Math.floor(Math.random() * 5);
    document.getElementById("img4").src = images[random_number];

    random_number = Math.floor(Math.random() * 5);
    document.getElementById("img5").src = images[random_number];
}

function stopSpinning() {

    document.getElementById("START").disabled = false;
    document.getElementById("Stop").disabled = true;

    clearInterval(gameInterval);

    var img1 = document.getElementById("img1").src;
    var img2 = document.getElementById("img2").src;
    var img3 = document.getElementById("img3").src;
    var img4 = document.getElementById("img4").src;
    var img5 = document.getElementById("img5").src;

    if (img1 == img2 && img2 == img3 && img3 == img4 && img4 == img5) {
        wins = wins + 1;
        document.getElementById("wins").innerHTML = wins;
    } 
    else 
    {
        losts = losts + 1;
        document.getElementById("losts").innerHTML = losts;
    }
}

</script>

</body>
</html>
