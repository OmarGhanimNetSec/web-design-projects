<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Calculator UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="mx-auto calc card shadow-sm">
            <div class="card-body p-3">

                <input id="display" class="form-control calc-display mb-3" type="text" value="" readonly />

                <div class="d-grid gap-2">

                    <div class="row g-2">
                        <div class="col-9">
                            <button class="btn btn-danger w-100" onclick="clearDisplay()">C</button>
                        </div>
                        <div class="col">
                            <button class="btn btn-warning w-100" onclick="number_to_display('/')">÷</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('7')">7</button></div>
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('8')">8</button></div>
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('9')">9</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100" onclick="number_to_display('*')">×</button></div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('4')">4</button></div>
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('5')">5</button></div>
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('6')">6</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100" onclick="number_to_display('-')">−</button></div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('1')">1</button></div>
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('2')">2</button></div>
                        <div class="col-3"><button class="btn btn-light w-100" onclick="number_to_display('3')">3</button></div>
                        <div class="col-3"><button class="btn btn-warning w-100" onclick="number_to_display('+')">+</button></div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <button class="btn btn-light w-100" onclick="number_to_display('0')">0</button>
                        </div>
                        <div class="col-3">
                            <button class="btn btn-light w-100" onclick="number_to_display('.')">.</button>
                        </div>
                        <div class="col-3">
                            <button class="btn btn-success w-100" onclick="calculateResult()">=</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

<script>

let current_display = "";

function number_to_display(value) {
    current_display = current_display + value;
    document.getElementById("display").value = current_display;
}

function clearDisplay() {
    current_display = "";
    document.getElementById("display").value = "";
}

function calculateResult() {
    try {
        current_display = eval(current_display);
        document.getElementById("display").value = current_display;
    } catch {
        document.getElementById("display").value = "Error";
        current_display = "";
    }
}

</script>

</body>
</html>
